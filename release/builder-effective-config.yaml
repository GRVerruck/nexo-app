directories:
  output: release
  buildResources: build
appId: com.nexo.app
productName: NEXO
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
      - src/data/**/*
extraResources:
  - from: src/data/initialSeed.json
    to: data/initialSeed.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NEXO
electronVersion: 33.4.11
